<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" preserveAspectRatio="none">
  <!-- 矢印の先端 (三角形) -->
  <polygon points="50,5 70,25 30,25" fill="black"/>
  <!-- ベースの円 -->
  <circle cx="50" cy="60" r="26" fill="white" stroke="black" stroke-width="4"/>
  <!-- 縦線 (マイクスタンド) -->
  <line x1="50" y1="25" x2="50" y2="95" stroke="black" stroke-width="4"/>
  <!-- テキストの縁取り (線をくり抜く) -->
  <text x="50" y="63" font-size="22" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle" font-weight="bold" stroke="white" stroke-width="6" stroke-linejoin="round">Vo</text>
  <!-- テキスト本体 -->
  <text x="50" y="63" font-size="22" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="black">Vo</text>
</svg>