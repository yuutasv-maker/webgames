<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海の家 WebGames</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <!-- 運用設定ファイル: 本日のゲーム・ローテーション判定 -->
    <script src="config.js"></script>
    <script>
        // 即時リダイレクト（レンダリング前の最速遷移）
        function doRedirect() {
            try {
                var target = typeof resolveActiveGame === 'function' ? resolveActiveGame() : null;
                // isPortal（?portal=true または activeGame: 'portal'）時は portal.html へ転送
                var destination = (target && target.isPortal) ? 'portal.html' : (target && target.redirectUrl ? target.redirectUrl : 'portal.html');
                window.location.replace(destination);
            } catch (e) {
                console.error('Redirect check error:', e);
                window.location.replace('portal.html');
            }
        }
        doRedirect();
        // Safari WebKit 等の BFCache（戻る/進むキャッシュ）復帰時にも確実に再リダイレクトを実行
        window.addEventListener('pageshow', function(e) {
            if (e.persisted) {
                doRedirect();
            }
        });
    </script>
</head>
<body>
    <div class="page-bg"></div>
    <div class="container" style="text-align: center; padding: 48px 16px;">
        <div class="redirect-notice" style="display: block; max-width: 400px; margin: 0 auto;">
            <p>🏖️ ゲームへ移動中...</p>
            <p style="margin-top: 12px;">
                <a href="portal.html" class="redirect-manual-link">自動で移動しない場合はこちら（ゲーム一覧）</a>
            </p>
        </div>

        <noscript>
            <div class="redirect-notice" style="display: block; max-width: 400px; margin: 16px auto 0;">
                <p>🏖️ JavaScriptが無効です。</p>
                <p style="margin-top: 8px;">
                    <a href="portal.html" class="redirect-manual-link">ミニゲーム一覧はこちら</a>
                </p>
            </div>
        </noscript>
    </div>
</body>
</html>
