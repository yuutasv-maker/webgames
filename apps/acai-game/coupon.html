<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>【GoGoUmi Paradise】特別クーポン券</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%%22 y=%2250%%22 style=%22dominant-baseline:central;text-anchor:middle;font-size:90px;%22>🎫</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Zen Maru Gothic', 'Outfit', sans-serif;
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            color: #4a235a;
        }

        .coupon-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            position: relative;
        }

        .congrats-badge {
            display: inline-block;
            background: linear-gradient(135deg, #ff007f, #ff758c);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(255, 0, 127, 0.3);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-6px); }
            60% { transform: translateY(-3px); }
        }

        h1 {
            font-size: 22px;
            font-weight: 900;
            color: #4a235a;
            margin-bottom: 6px;
        }

        .shop-name {
            font-size: 13px;
            color: #888;
            margin-bottom: 20px;
            font-weight: 700;
        }

        /* チケットデザイン */
        .ticket-card {
            background: #fff;
            border: 2px dashed #a18cd1;
            border-radius: 16px;
            padding: 20px 16px;
            margin-bottom: 20px;
            position: relative;
            box-shadow: 0 8px 20px rgba(161, 140, 209, 0.15);
        }

        .ticket-title {
            font-size: 14px;
            font-weight: 700;
            color: #7b4397;
            margin-bottom: 6px;
        }

        .discount-highlight {
            font-size: 26px;
            font-weight: 900;
            color: #ff007f;
            line-height: 1.2;
            margin-bottom: 10px;
        }

        .discount-highlight span {
            font-size: 16px;
            color: #4a235a;
        }

        .ticket-desc {
            font-size: 12px;
            color: #666;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .barcode-area {
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 12px 8px;
            margin-bottom: 8px;
        }

        .barcode {
            font-family: monospace;
            font-size: 24px;
            letter-spacing: 4px;
            color: #333;
            user-select: all;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .coupon-code {
            font-size: 11px;
            color: #888;
            letter-spacing: 1px;
        }

        .validity {
            font-size: 12px;
            font-weight: 700;
            color: #d81b60;
            background: #fce4ec;
            padding: 4px 8px;
            border-radius: 6px;
            display: inline-block;
            margin-top: 8px;
        }

        .notice-list {
            text-align: left;
            font-size: 11px;
            color: #777;
            background: rgba(0, 0, 0, 0.03);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .notice-list li {
            margin-left: 16px;
            margin-bottom: 4px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            display: block;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 900;
            text-align: center;
            transition: transform 0.1s, box-shadow 0.2s;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            color: #4a235a;
            box-shadow: 0 6px 14px rgba(161, 140, 209, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #555;
        }

        .btn:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>
    <div class="coupon-container">
        <div class="congrats-badge">🎉 7秒クリア達成特典</div>
        <h1>限定特別クーポン券</h1>
        <div class="shop-name">海の家 GoGoUmi Paradise 🏖️</div>

        <div class="ticket-card">
            <div class="ticket-title">映えアサイー職人 チャレンジ成功</div>
            <div id="record-display" style="display: none; background: #fff0f6; color: #d81b60; border: 1px solid #f8bbd0; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 900; margin-bottom: 10px; letter-spacing: 0.5px;"></div>
            <div class="discount-highlight">
                バニラアイストッピング追加 <span>または</span> 100円引き
            </div>
            <div class="coupon-image-area" style="background: #fafafa; border: 1px solid #eee; border-radius: 12px; padding: 12px; margin-bottom: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100px;">
                <img src="../../common/images/acai_ice.png" alt="アサイーボウル バニラアイストッピング" style="max-width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
            </div>

            <div class="validity">
                有効期限: <span id="valid-until">本日限り有効</span>
            </div>
        </div>

        <ul class="notice-list">
            <li>※ 本クーポンはお1人様1日1回限りのご利用となります。</li>
            <li>※ 他の割引券・キャンペーンとの併用はできません。</li>
            <li>※ 会計時にスタッフへこの画面をお見せください。</li>
            <li>※ 本券はゲーム達成特典の仮クーポン画面です。</li>
        </ul>

        <div class="btn-group">
            <a href="index.html" class="btn btn-primary">🎮 もう一度遊ぶ</a>
        </div>
    </div>

    <script>
        // クリアタイムの反映
        const params = new URLSearchParams(window.location.search);
        const clearTime = params.get('time');
        if (clearTime) {
            const recordEl = document.getElementById('record-display');
            recordEl.textContent = `⏱️ クリアタイム: ${clearTime}秒`;
            recordEl.style.display = 'inline-block';
        }

        // 本日の日付を有効期限にセット
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        document.getElementById('valid-until').textContent = `${y}年${m}月${d}日 本日限り有効`;
    </script>
</body>
</html>
