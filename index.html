<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海の家 ミニゲームコレクション</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-bg"></div>
    <div class="container">
        <header>
            <h1>海の家<br>ミニゲームコレクション 🏖️</h1>
            <p>友人と一緒に楽しめる、ブラウザですぐに遊べるカジュアルゲーム！</p>
        </header>

        <div class="game-grid">
            <!-- ゲーム1 -->
            <a href="apps/watermelon-game/index.html" class="game-card">
                <div class="card-icon" style="background: linear-gradient(135deg, #ff8b94, #ffaaa5);">🍉</div>
                <div class="card-content">
                    <h2>スイカ割りタイミングゲーム</h2>
                    <p>タイミングを合わせてタップ！真ん中を狙って綺麗なスイカを割ろう！</p>
                </div>
            </a>

            <!-- ゲーム2 -->
            <a href="apps/bbq-game/index.html" class="game-card">
                <div class="card-icon" style="background: linear-gradient(135deg, #ff9a9e, #fecfef);">🍖</div>
                <div class="card-content">
                    <h2>爆速BBQ串メーカー</h2>
                    <p>制限時間内にお手本通りの具材を串に刺しまくるスピード勝負！</p>
                </div>
            </a>

            <!-- ゲーム3 -->
            <a href="apps/acai-game/index.html" class="game-card">
                <div class="card-icon" style="background: linear-gradient(135deg, #a18cd1, #fbc2eb);">🫐</div>
                <div class="card-content">
                    <h2>映えアサイー職人</h2>
                    <p>一瞬だけ表示されるお手本を記憶して、完璧なアサイーボウルを再現！</p>
                </div>
            </a>
        </div>
    </div>
</body>
</html>
