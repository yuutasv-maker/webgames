<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スタジオOWL イベント登録フォーム</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ==========================================
           リセット & ベース
           ========================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-primary: #0f1623;
            --bg-secondary: #1a2332;
            --bg-card: rgba(26, 35, 50, 0.85);
            --bg-input: rgba(15, 22, 35, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-focus: #d4a24e;
            --text-primary: #e8eaf0;
            --text-secondary: #8a94a6;
            --text-label: #c0c8d8;
            --accent: #d4a24e;
            --accent-hover: #e6b85e;
            --accent-glow: rgba(212, 162, 78, 0.25);
            --success: #34d399;
            --success-bg: rgba(52, 211, 153, 0.12);
            --warning: #fbbf24;
            --warning-bg: rgba(251, 191, 36, 0.12);
            --error: #f87171;
            --error-bg: rgba(248, 113, 113, 0.12);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* ==========================================
           背景のグラデーション装飾
           ========================================== */
        body::before {
            content: '';
            position: fixed;
            top: -40%;
            right: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(212, 162, 78, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -30%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* ==========================================
           レイアウト
           ========================================== */
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 40px 20px 60px;
            position: relative;
            z-index: 1;
        }

        /* ==========================================
           ヘッダー
           ========================================== */
        .header {
            text-align: center;
            margin-bottom: 36px;
        }

        .header__icon {
            font-size: 40px;
            margin-bottom: 8px;
            display: block;
        }

        .header__title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.02em;
            background: linear-gradient(135deg, var(--accent), #f0d090);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header__subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* ==========================================
           カード
           ========================================== */
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 32px;
            margin-bottom: 20px;
        }

        .card__title {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card__title::before {
            content: '';
            display: inline-block;
            width: 3px;
            height: 16px;
            background: var(--accent);
            border-radius: 2px;
        }

        /* ==========================================
           フォーム要素
           ========================================== */
        .form-group {
            margin-bottom: 18px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-label);
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="date"],
        input[type="time"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            transition: border-color var(--transition), box-shadow var(--transition);
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%238a94a6' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 10px center;
            background-repeat: no-repeat;
            background-size: 20px;
            padding-right: 36px;
        }

        select option {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        /* ==========================================
           定期イベント クイック選択
           ========================================== */
        .quick-select {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .quick-select__btn {
            padding: 6px 14px;
            font-size: 12px;
            font-family: inherit;
            background: rgba(212, 162, 78, 0.1);
            border: 1px solid rgba(212, 162, 78, 0.25);
            border-radius: 20px;
            color: var(--accent);
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
        }

        .quick-select__btn:hover {
            background: rgba(212, 162, 78, 0.2);
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .quick-select__btn.active {
            background: var(--accent);
            color: var(--bg-primary);
            font-weight: 600;
        }

        /* ==========================================
           チェックボックス / トグル
           ========================================== */
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 4px;
        }

        .toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            user-select: none;
        }

        .toggle input[type="checkbox"] {
            display: none;
        }

        .toggle__switch {
            width: 42px;
            height: 24px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            position: relative;
            transition: background var(--transition);
            flex-shrink: 0;
        }

        .toggle__switch::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            background: var(--text-secondary);
            border-radius: 50%;
            top: 3px;
            left: 3px;
            transition: all var(--transition);
        }

        .toggle input:checked + .toggle__switch {
            background: var(--accent);
        }

        .toggle input:checked + .toggle__switch::after {
            background: white;
            left: 21px;
        }

        .toggle__label {
            font-size: 13px;
            color: var(--text-label);
        }

        /* ==========================================
           ステータス切り替え（ラジオ風）
           ========================================== */
        .status-toggle {
            display: flex;
            gap: 0;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .status-toggle__option {
            flex: 1;
            text-align: center;
        }

        .status-toggle__option input {
            display: none;
        }

        .status-toggle__option label {
            display: block;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
            margin-bottom: 0;
            border-right: 1px solid var(--border-color);
        }

        .status-toggle__option:last-child label {
            border-right: none;
        }

        .status-toggle__option input:checked + label {
            background: rgba(212, 162, 78, 0.15);
            color: var(--accent);
        }

        /* ==========================================
           送信ボタン
           ========================================== */
        .submit-btn {
            width: 100%;
            padding: 14px 24px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            background: linear-gradient(135deg, var(--accent), #c4922e);
            color: var(--bg-primary);
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition);
            letter-spacing: 0.03em;
            position: relative;
            overflow: hidden;
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, var(--accent-hover), #d4a23e);
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(212, 162, 78, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .submit-btn .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(15, 22, 35, 0.3);
            border-top-color: var(--bg-primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        .submit-btn.loading .spinner {
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ==========================================
           結果メッセージ
           ========================================== */
        .result {
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            margin-top: 16px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .result.show { display: block; }

        .result--success {
            background: var(--success-bg);
            border: 1px solid rgba(52, 211, 153, 0.3);
            color: var(--success);
        }

        .result--skip {
            background: var(--warning-bg);
            border: 1px solid rgba(251, 191, 36, 0.3);
            color: var(--warning);
        }

        .result--error {
            background: var(--error-bg);
            border: 1px solid rgba(248, 113, 113, 0.3);
            color: var(--error);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ==========================================
           自動補完ヒント
           ========================================== */
        .autofill-hint {
            font-size: 11px;
            color: var(--accent);
            margin-top: 4px;
            opacity: 0;
            transition: opacity var(--transition);
        }

        .autofill-hint.show {
            opacity: 1;
        }

        /* ==========================================
           画像アップロード
           ========================================== */
        .image-upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.12);
            border-radius: var(--radius-sm);
            padding: 28px 20px;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition);
            position: relative;
        }

        .image-upload-area:hover,
        .image-upload-area.dragover {
            border-color: var(--accent);
            background: rgba(212, 162, 78, 0.06);
        }

        .image-upload-area__icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .image-upload-area__text {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .image-upload-area__text span {
            color: var(--accent);
            text-decoration: underline;
        }

        .image-upload-area input[type="file"] {
            display: none;
        }

        .image-preview {
            margin-top: 14px;
            display: none;
            position: relative;
        }

        .image-preview.show {
            display: block;
        }

        .image-preview img {
            max-width: 100%;
            max-height: 250px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            display: block;
            margin: 0 auto;
        }

        .image-preview__info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .image-preview__status {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .image-preview__status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .image-preview__status .dot--pending { background: var(--warning); }
        .image-preview__status .dot--success { background: var(--success); }
        .image-preview__status .dot--error { background: var(--error); }

        .image-preview__remove {
            background: none;
            border: none;
            color: var(--error);
            font-size: 12px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background var(--transition);
            font-family: inherit;
        }

        .image-preview__remove:hover {
            background: var(--error-bg);
        }

        /* ==========================================
           レスポンシブ
           ========================================== */
        @media (max-width: 600px) {
            .container {
                padding: 24px 16px 40px;
            }
            .card {
                padding: 20px;
            }
            .form-row,
            .form-row-3 {
                grid-template-columns: 1fr;
            }
            .header__title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ヘッダー -->
        <div class="header">
            <span class="header__icon">🦉</span>
            <h1 class="header__title">スタジオOWL イベント登録</h1>
            <p class="header__subtitle">フォームに入力して「登録」ボタンを押してください</p>
        </div>

        <!-- ====== イベントタイトル ====== -->
        <div class="card">
            <div class="card__title">イベント情報</div>

            <div class="form-group">
                <label for="title">イベントタイトル</label>
                <input type="text" id="title" placeholder="例: フリーライブ、弾キガタリスト...">
                <div class="autofill-hint" id="autofill-hint">✨ 定期イベントの情報を自動入力しました</div>
            </div>

            <div class="form-group">
                <label>定期イベントから選択（クイック入力）</label>
                <div class="quick-select" id="quick-select">
                    <!-- JS で動的に生成 -->
                </div>
            </div>

            <div class="form-group">
                <label for="category">イベントカテゴリー</label>
                <select id="category">
                    <option value="">（未選択 / 自動補完に任せる）</option>
                </select>
            </div>
        </div>

        <!-- ====== 日時 ====== -->
        <div class="card">
            <div class="card__title">日時</div>

            <div class="form-row">
                <div class="form-group">
                    <label for="start_date">開始日付 *</label>
                    <input type="date" id="start_date">
                </div>
                <div class="form-group">
                    <label for="end_date">終了日付（空なら開始日と同じ）</label>
                    <input type="date" id="end_date">
                </div>
            </div>

            <div class="form-row-3">
                <div class="form-group">
                    <label for="open_time">開場時間</label>
                    <input type="time" id="open_time">
                </div>
                <div class="form-group">
                    <label for="start_time">開始時間</label>
                    <input type="time" id="start_time">
                </div>
                <div class="form-group">
                    <label for="end_time">終了時間</label>
                    <input type="time" id="end_time">
                </div>
            </div>
        </div>

        <!-- ====== 料金 ====== -->
        <div class="card">
            <div class="card__title">料金</div>

            <div class="form-row">
                <div class="form-group">
                    <label for="advance_price">前売り料金</label>
                    <input type="text" id="advance_price" placeholder="例: 1200">
                </div>
                <div class="form-group">
                    <label for="door_price">当日料金</label>
                    <input type="text" id="door_price" placeholder="例: 1500">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>ドリンク</label>
                    <label class="toggle">
                        <input type="checkbox" id="drink">
                        <span class="toggle__switch"></span>
                        <span class="toggle__label">1ドリンク付き</span>
                    </label>
                </div>
                <div class="form-group">
                    <label for="other">その他（軽食など）</label>
                    <input type="text" id="other" placeholder="例: 軽食">
                </div>
            </div>
        </div>

        <!-- ====== 詳細 ====== -->
        <div class="card">
            <div class="card__title">詳細</div>

            <div class="form-group">
                <label for="description">出演者・詳細</label>
                <textarea id="description" placeholder="出演者名やイベント詳細を入力してください。&#10;改行は \\n で表現します。"></textarea>
            </div>
        </div>

        <!-- ====== アイキャッチ画像 ====== -->
        <div class="card">
            <div class="card__title">アイキャッチ画像</div>

            <div class="image-upload-area" id="upload-area" onclick="document.getElementById('image_file').click()">
                <div class="image-upload-area__icon">📷</div>
                <div class="image-upload-area__text">
                    <span>ファイルを選択</span> またはここにドラッグ＆ドロップ
                </div>
                <input type="file" id="image_file" accept="image/*">
            </div>

            <div class="image-preview" id="image-preview">
                <img id="preview-img" src="" alt="プレビュー">
                <div class="image-preview__info">
                    <div class="image-preview__status" id="upload-status">
                        <span class="dot dot--pending"></span>
                        <span>アップロード待ち</span>
                    </div>
                    <button type="button" class="image-preview__remove" onclick="removeImage()">✕ 画像を削除</button>
                </div>
            </div>
        </div>

        <!-- ====== オプション ====== -->
        <div class="card">
            <div class="card__title">オプション</div>

            <div class="form-group">
                <label>公開ステータス</label>
                <div class="status-toggle">
                    <div class="status-toggle__option">
                        <input type="radio" name="status" id="status_publish" value="publish" checked>
                        <label for="status_publish">公開 (publish)</label>
                    </div>
                    <div class="status-toggle__option">
                        <input type="radio" name="status" id="status_draft" value="draft">
                        <label for="status_draft">下書き (draft)</label>
                    </div>
                </div>
            </div>

            <div class="checkbox-group">
                <label class="toggle">
                    <input type="checkbox" id="featured">
                    <span class="toggle__switch"></span>
                    <span class="toggle__label">注目イベント（Pick Up Live!）</span>
                </label>

                <label class="toggle">
                    <input type="checkbox" id="all_day">
                    <span class="toggle__switch"></span>
                    <span class="toggle__label">終日イベント</span>
                </label>
            </div>
        </div>

        <!-- ====== 送信 ====== -->
        <button class="submit-btn" id="submit-btn" onclick="submitEvent()">
            <span class="spinner"></span>
            イベントを登録する
        </button>

        <div class="result" id="result"></div>
    </div>

    <script>
        // ==========================================
        // 初期化: 定期イベント・カテゴリ情報の読み込み
        // ==========================================
        let recurringEvents = {};
        let titleAliases = {};
        let uploadedImageId = null;  // アップロード済み画像のメディアID

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/api/recurring-events');
                const data = await res.json();
                recurringEvents = data.recurring_events || {};
                titleAliases = data.title_aliases || {};
                const categories = data.categories || [];

                // カテゴリドロップダウンの生成
                const catSelect = document.getElementById('category');
                categories.forEach(cat => {
                    const opt = document.createElement('option');
                    opt.value = cat;
                    opt.textContent = cat;
                    catSelect.appendChild(opt);
                });

                // クイック選択ボタンの生成
                const quickSelect = document.getElementById('quick-select');
                Object.keys(recurringEvents).forEach(name => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'quick-select__btn';
                    btn.textContent = name;
                    btn.onclick = () => selectRecurringEvent(name, btn);
                    quickSelect.appendChild(btn);
                });

            } catch (err) {
                console.error('初期データの読み込みに失敗:', err);
            }
        });

        // ==========================================
        // 定期イベントのクイック選択
        // ==========================================
        function selectRecurringEvent(name, btnElement) {
            const template = recurringEvents[name];
            if (!template) return;

            // ボタンのアクティブ状態を切り替え
            document.querySelectorAll('.quick-select__btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');

            // タイトルをセット
            document.getElementById('title').value = name;

            // テンプレートの値でフォームを自動入力
            if (template['開始時間']) document.getElementById('start_time').value = template['開始時間'];
            if (template['終了時間']) document.getElementById('end_time').value = template['終了時間'];
            if (template['イベントカテゴリー']) document.getElementById('category').value = template['イベントカテゴリー'];
            if (template['前売り料金']) document.getElementById('advance_price').value = template['前売り料金'];
            if (template['当日料金']) document.getElementById('door_price').value = template['当日料金'];
            if (template['出演者・詳細']) document.getElementById('description').value = template['出演者・詳細'].replace(/\\n/g, '\n');
            if (template['その他']) document.getElementById('other').value = template['その他'];

            // ドリンク
            document.getElementById('drink').checked = (template['ドリンク'] === 'x');

            // 自動補完ヒントを表示
            const hint = document.getElementById('autofill-hint');
            hint.classList.add('show');
            setTimeout(() => hint.classList.remove('show'), 3000);
        }

        // ==========================================
        // 画像アップロード
        // ==========================================
        const uploadArea = document.getElementById('upload-area');
        const imageFileInput = document.getElementById('image_file');

        // ファイル選択時
        imageFileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleImageFile(e.target.files[0]);
            }
        });

        // ドラッグ＆ドロップ
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleImageFile(e.dataTransfer.files[0]);
            }
        });

        async function handleImageFile(file) {
            if (!file.type.startsWith('image/')) {
                showResult('error', '画像ファイルを選択してください。');
                return;
            }

            // プレビュー表示
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('preview-img').src = e.target.result;
                document.getElementById('image-preview').classList.add('show');
            };
            reader.readAsDataURL(file);

            // WordPressへアップロード
            updateUploadStatus('pending', 'アップロード中...');

            const formData = new FormData();
            formData.append('image', file);

            try {
                const res = await fetch('/api/upload-image', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();

                if (data.status === 'success') {
                    uploadedImageId = data.media_id;
                    updateUploadStatus('success', `アップロード完了 (ID: ${data.media_id})`);
                } else {
                    uploadedImageId = null;
                    updateUploadStatus('error', data.message);
                }
            } catch (err) {
                uploadedImageId = null;
                updateUploadStatus('error', '通信エラー');
            }
        }

        function updateUploadStatus(status, text) {
            const statusEl = document.getElementById('upload-status');
            const dotClasses = { pending: 'dot--pending', success: 'dot--success', error: 'dot--error' };
            statusEl.innerHTML = `<span class="dot ${dotClasses[status] || ''}"></span><span>${text}</span>`;
        }

        function removeImage() {
            uploadedImageId = null;
            document.getElementById('image-preview').classList.remove('show');
            document.getElementById('preview-img').src = '';
            imageFileInput.value = '';
            updateUploadStatus('pending', 'アップロード待ち');
        }

        // ==========================================
        // フォーム送信
        // ==========================================
        async function submitEvent() {
            const btn = document.getElementById('submit-btn');
            const resultEl = document.getElementById('result');

            // バリデーション
            const title = document.getElementById('title').value.trim();
            const startDate = document.getElementById('start_date').value;

            if (!title) {
                showResult('error', 'イベントタイトルを入力してください。');
                return;
            }
            if (!startDate) {
                showResult('error', '開始日付を入力してください。');
                return;
            }

            // 送信中の状態
            btn.disabled = true;
            btn.classList.add('loading');
            resultEl.classList.remove('show');

            const payload = {
                title: title,
                start_date: startDate,
                open_time: document.getElementById('open_time').value,
                start_time: document.getElementById('start_time').value,
                end_date: document.getElementById('end_date').value,
                end_time: document.getElementById('end_time').value,
                all_day: document.getElementById('all_day').checked,
                category: document.getElementById('category').value,
                description: document.getElementById('description').value,
                advance_price: document.getElementById('advance_price').value,
                door_price: document.getElementById('door_price').value,
                drink: document.getElementById('drink').checked,
                other: document.getElementById('other').value,
                featured: document.getElementById('featured').checked,
                status: document.querySelector('input[name="status"]:checked').value,
                image_id: uploadedImageId
            };

            try {
                const res = await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                showResult(data.status, data.message);
            } catch (err) {
                showResult('error', `通信エラーが発生しました: ${err.message}`);
            } finally {
                btn.disabled = false;
                btn.classList.remove('loading');
            }
        }

        // ==========================================
        // 結果表示
        // ==========================================
        function showResult(status, message) {
            const el = document.getElementById('result');
            el.className = 'result show';

            const icons = { success: '✅', skip: '⚠️', error: '❌' };
            const classes = { success: 'result--success', skip: 'result--skip', error: 'result--error' };

            el.classList.add(classes[status] || 'result--error');
            el.textContent = `${icons[status] || '❌'} ${message}`;

            // 画面下部にスクロール
            el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    </script>
</body>
</html>
