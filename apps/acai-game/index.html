<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>映えアサイー職人</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%%22 y=%2250%%22 style=%22dominant-baseline:central;text-anchor:middle;font-size:90px;%22>🫐</text></svg>">
    <link rel="stylesheet" href="../../common/coupon.css">
    <link rel="stylesheet" href="style.css?v=16">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <header>
            <h1>映えアサイー職人 🫐</h1>
            <p>お手本を覚えて、同じボウルを作ろう！</p>
        </header>

        <div class="game-stage">
            <div id="big-countdown" class="hidden"></div>
            <!-- お手本ボウル -->
            <div id="reference-view" class="bowl-container">
                <div class="bowl-label">お手本</div>
                <div class="bowl">
                    <div class="bowl-base"></div>
                    <div class="question-mark" id="ref-question">？</div>
                    <div class="slot-grid">
                        <div class="slot" id="ref-0"></div>
                        <div class="slot" id="ref-1"></div>
                        <div class="slot" id="ref-2"></div>
                        <div class="slot" id="ref-3"></div>
                    </div>
                </div>
            </div>

            <!-- プレイヤー用ボウル -->
            <div id="player-view" class="bowl-container hidden">
                <div class="bowl-label">あなたのボウル</div>
                <div class="bowl interactive" id="player-bowl">
                    <div class="bowl-base"></div>
                    <div class="slot-grid">
                        <div class="slot player-slot active" data-index="0" id="player-0"></div>
                        <div class="slot player-slot" data-index="1" id="player-1"></div>
                        <div class="slot player-slot" data-index="2" id="player-2"></div>
                        <div class="slot player-slot" data-index="3" id="player-3"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="palette-container" class="palette-container hidden">
            <p class="palette-label">トッピングを選択</p>
            <div id="palette" class="palette disabled">
                <button class="ing-btn" data-type="strawberry">🍓</button>
                <button class="ing-btn" data-type="banana">🍌</button>
                <button class="ing-btn" data-type="blueberry">🫐</button>
                <button class="ing-btn" data-type="mango">🥭</button>
                <button class="ing-btn" data-type="coconut">🥥</button>
                <button class="ing-btn" data-type="kiwi">🥝</button>
            </div>
        </div>

        <div class="controls">
            <button id="main-btn" class="action-btn">スタート</button>
        </div>

        <!-- 結果モーダル -->
        <div id="modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="modal-title">結果発表</h2>
                <p id="modal-desc">完璧な仕上がり！</p>
                <div id="clear-time" class="hidden" style="font-size: 20px; font-weight: 900; color: #ff007f; margin-bottom: 16px;"></div>
                
                <!-- クーポン獲得セクション -->
                <div id="coupon-section" class="coupon-section hidden">
                    <p id="coupon-msg" class="coupon-msg"></p>
                    <a id="coupon-btn" href="../../common/coupon.html?game=acai" class="coupon-btn hidden">🎫 クーポンを受け取る</a>
                </div>

                <div id="correct-answer" class="hidden" style="margin-top: 16px; margin-bottom: 24px;">
                    <p id="correct-label" style="font-size: 14px; color: #666; margin-bottom: 8px; font-weight: 700;">正解のお手本：</p>
                    <div class="result-bowl">
                        <div class="bowl-base"></div>
                        <div id="correct-pattern" class="result-slot-grid"></div>
                    </div>
                </div>
                <button id="retry-btn" class="action-btn">もう一度挑戦</button>
            </div>
        </div>
    </div>
    <script src="../../common/coupon-manager.js"></script>
    <script src="script.js?v=9"></script>
</body>
</html>
